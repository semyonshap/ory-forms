services:
  kratos:
    image: oryd/kratos:latest
    ports:
      - '4433:4433'
      - '4434:4434'
    command: serve -c /etc/config/kratos.yaml --dev --watch-courier
    volumes:
      - ../config:/etc/config

  mailslurper:
    image: oryd/mailslurper:latest-smtps
    ports:
      - '4436:4436'
      - '4437:4437'

  keto:
    image: oryd/keto:latest
    ports:
      - '4466:4466'
      - '4467:4467'
    command: serve all -c /etc/config/keto.yaml
    volumes:
      - ../config:/etc/config

  hydra:
    image: oryd/hydra:latest
    ports:
      - '4444:4444'
      - '4445:4445'
    command: serve all -c /etc/config/hydra.yaml --dev
    volumes:
      - ../config:/etc/config

  init:
    image: curlimages/curl:latest
    depends_on:
      - kratos
      - hydra
      - keto
    restart: on-failure
    volumes:
      - ../config/init.sh:/init.sh
    entrypoint: sh /init.sh

  hydra-oauth2-test:
    image: oryd/hydra:latest
    network_mode: host
    depends_on:
      - init
    command: >
      perform authorization-code
      --client-id my-client
      --client-secret my-secret
      --endpoint http://localhost:4444
      --port 5555
      --scope openid,email,profile,offline
      --no-shutdown
      --prompt consent
