dsn: memory

secrets:
  cookie:
    - dev-cookie-secret-not-secure
  cipher:
    - this-is-a-32-char-dev-secret-key

log:
  level: warning
  format: text
  leak_sensitive_values: false

serve:
  public:
    port: 4433
    base_url: http://localhost:8080
  admin:
    port: 4434

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/identity_schema.json

session:
  whoami:
    required_aal: highest_available

selfservice:
  default_browser_return_url: http://localhost:8080
  allowed_return_urls:
    - http://localhost:8080

  methods:
    password:
      enabled: true
    totp:
      enabled: true
    lookup_secret:
      enabled: true
    code:
      enabled: true
      mfa_enabled: true
      passwordless_enabled: false
      config:
        lifespan: 10m
    webauthn:
      enabled: true
      config:
        passwordless: false
        rp:
          display_name: 'Ory'
          id: 'localhost'
          origin: 'http://localhost:8080'
    passkey:
      enabled: true
      config:
        rp:
          display_name: 'Ory'
          id: 'localhost'
          origins:
            - 'http://localhost:8080'

  flows:
    error:
      ui_url: http://localhost:8080/auth/error

    login:
      ui_url: http://localhost:8080/auth/login
      lifespan: 10m
      after:
        password:
          hooks:
            - hook: web_hook
              config: &captcha-hook
                url: http://host.docker.internal:8080/custom-service/verify
                method: POST
                can_interrupt: true
                response:
                  parse: true
                body: file:///etc/config/captcha-body.jsonnet
                auth:
                  type: api_key
                  config:
                    in: header
                    name: X-Webhook-Key
                    value: super-webhook-secret-key

    registration:
      ui_url: http://localhost:8080/auth/registration
      lifespan: 10m
      after:
        password:
          hooks:
            - hook: web_hook
              config: *captcha-hook
            - hook: show_verification_ui
            - hook: session
        oidc:
          hooks:
            - hook: show_verification_ui
            - hook: session

    settings:
      ui_url: http://localhost:8080/settings
      required_aal: highest_available
      after:
        password:
          hooks:
            - hook: revoke_active_sessions

    recovery:
      enabled: true
      ui_url: http://localhost:8080/auth/recovery
      use: code

    verification:
      enabled: true
      ui_url: http://localhost:8080/auth/verification
      use: code
      after:
        default_browser_return_url: http://localhost:8080
    logout:
      after:
        default_browser_return_url: http://localhost:8080/auth/login

courier:
  smtp:
    connection_uri: smtps://test:test@mailslurper:1025/?skip_ssl_verify=true

oauth2_provider:
  url: http://localhost:4445
  override_return_to: true
